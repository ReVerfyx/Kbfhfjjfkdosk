{% extends "base_mobile.html" %}{% block title %}Профиль{% endblock %}{% block content %}
<div class="mobile-page-head"><small>PROFILE</small><h1>Редактирование</h1></div>
<form method="post" enctype="multipart/form-data" class="m-settings-form"><input type="hidden" name="_csrf" value="{{csrf_token()}}">
<label>Имя<input name="display_name" maxlength="40" value="{{user.display_name}}"></label><label>О себе<textarea name="bio" maxlength="180">{{user.bio}}</textarea></label><label>Аватар<input type="file" name="avatar" accept="image/*"></label><label>Фото/видео фон<input type="file" name="cover" accept="image/*,video/*"></label><label>Музыка<input type="file" name="music" accept="audio/*"></label><label>Название музыки<input name="music_title" value="{{user.music_title}}"></label><label>Тема<select name="theme"><option value="dark">Тёмная</option><option value="black">Чёрная</option><option value="violet">Фиолетовая</option><option value="red">Красная</option></select></label><button class="v4-primary mobile-full">Сохранить</button></form>
<div class="mobile-explain"><b>Синяя галочка</b><p>Можно подать заявку на верификацию.</p><form action="/verification/request" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><textarea name="message" maxlength="500" placeholder="Комментарий к заявке"></textarea><button class="v4-secondary mobile-full">Подать заявку</button></form></div>
{% endblock %}

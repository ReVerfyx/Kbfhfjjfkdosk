<article class="xpost">
  <a class="avatar" href="/u/{{p.username}}">{{p.username[:1]|upper}}</a>
  <div class="xbody">
    <div class="xmeta"><a href="/u/{{p.username}}">@{{p.username}}</a><span>· {{p.created_at}}</span></div>
    {% if p.body %}<div class="xtext">{{p.body}}</div>{% endif %}
    {% if p.image_path %}<a href="/p/{{p.id}}" class="postimage"><img src="{{url_for('static',filename=p.image_path)}}" alt="Фото публикации"></a>{% endif %}
    <div class="actions">
      <a href="/p/{{p.id}}">💬 {{p.replies_count}}</a>
      {% if me %}
      <form action="/p/{{p.id}}/like" method="post">
        <input type="hidden" name="_csrf" value="{{csrf_token()}}">
        <button>♡ {{p.likes_count}}</button>
      </form>
      {% else %}<a href="/login">♡ {{p.likes_count}}</a>{% endif %}
      <a href="/p/{{p.id}}">◉ {{p.views}}</a>
      <a href="/p/{{p.id}}">↗</a>
    </div>
  </div>
</article>

name: Проверка VPS backend

on:
  push:
    branches: [ "main" ]
    paths:
      - "app.py"
      - "db.py"
      - "monitor.py"
      - "sources.json"
      - "templates/**"
      - "static/**"
      - ".github/workflows/server-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile app.py db.py monitor.py moderation.py

      - name: Check installer syntax
        run: bash -n install.sh
      - name: Install backend requirements
        run: pip install -r requirements.txt
      - name: Import application and render desktop/mobile pages
        env:
          MW_SECRET_KEY: test-secret
          MW_DB: /tmp/mama-test.db
          MW_SOURCES: ./sources.json
          MW_ADMIN_USER: admin
          MW_ADMIN_PASSWORD: test-password-123
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()
          cases = [
              ("desktop", "Mozilla/5.0 (X11; Linux x86_64) Chrome/140"),
              ("mobile", "Mozilla/5.0 (Linux; Android 16; Mobile) Chrome/140"),
          ]
          for name, ua in cases:
              for path in ("/", "/status", "/streams", "/forum", "/support", "/u/admin", "/login", "/register"):
                  response = client.get(path, headers={"User-Agent": ua})
                  assert response.status_code == 200, (name, path, response.status_code)
                  assert b"Traceback" not in response.data
                  print(name, path, response.status_code, len(response.data))
          for path in ("/api/v1/status", "/api/v1/feed", "/api/v1/support"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              assert response.is_json, path
              print("api", path, response.status_code)
          print("backend render ok")
          PY
